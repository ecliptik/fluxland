# SPDX-License-Identifier: MIT
#
# Build and test fluxland on GitHub Actions. Forgejo reads .github/workflows
# too, so Actions stays off for the repo there. Every job calls tools/ci.sh,
# so the same steps run locally: tools/ci.sh build|sanitize|fuzz|ui|wlcs.

name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: build + unit tests
    runs-on: ubuntu-latest
    container: debian:trixie
    steps:
      - uses: actions/checkout@v4
      - run: tools/ci.sh deps
      - run: tools/ci.sh build

  sanitize:
    name: ASan + UBSan
    runs-on: ubuntu-latest
    container: debian:trixie
    steps:
      - uses: actions/checkout@v4
      - run: tools/ci.sh deps
      - run: tools/ci.sh sanitize

  fuzz:
    name: fuzz (short run)
    runs-on: ubuntu-latest
    container: debian:trixie
    steps:
      - uses: actions/checkout@v4
      - run: tools/ci.sh deps
      - run: tools/ci.sh fuzz
        env:
          FUZZ_SECONDS: "30"

  ui:
    name: UI tests (headless)
    runs-on: ubuntu-latest
    container: debian:trixie
    steps:
      - uses: actions/checkout@v4
      - run: tools/ci.sh deps
      - run: tools/ci.sh ui
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ui-results
          path: tests/ui/results/

  wlcs:
    name: Wayland conformance (wlcs)
    runs-on: ubuntu-latest
    container: debian:trixie
    steps:
      - uses: actions/checkout@v4
      - run: tools/ci.sh deps
      - run: tools/ci.sh wlcs
