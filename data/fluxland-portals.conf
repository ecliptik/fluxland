# xdg-desktop-portal backends for fluxland (see portals.conf(5)).
# Screen sharing and screenshots go through the wlroots portal; file
# choosers, settings and the rest through the GTK one.
[preferred]
default=gtk
org.freedesktop.impl.portal.ScreenCast=wlr
org.freedesktop.impl.portal.Screenshot=wlr
org.freedesktop.impl.portal.Inhibit=none
